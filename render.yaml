
databases:
  - name: clinicflow-db
    databaseName: clinicflow
    user: clinicflow
    plan: free
    # Stated explicitly. Without it Render uses the workspace
    # default, which is how the service and database ended up in
    # different regions on the first attempt.
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: clinicflow-api
    runtime: python
    plan: free
    # MUST match the database's region.
    #
    # Render's `fromDatabase` injects the INTERNAL connection string,
    # whose hostname (dpg-...-a) resolves only inside that region's
    # private network. A service in another region fails with a DNS
    # error rather than an auth or firewall one, which is what makes the
    # cause non-obvious from the traceback.
    region: oregon
    rootDir: backend

    buildCommand: pip install -r requirements.txt


    # Migrations run here, chained ahead of the server.
    #
    # preDeployCommand would be the better home for this — it runs once
    # per deploy, independent of instance count — but Render reserves it
    # for paid tiers. This is the correct free-tier equivalent, not a
    # workaround: startCommand is a single shell invocation, so
    # `flask db upgrade` completes before gunicorn execs, and the workers
    # it forks inherit an already-migrated database. No worker races
    # another for Alembic's version lock.
    #
    # The `&&` matters: if a migration fails, gunicorn never starts and
    # the deploy fails loudly rather than serving traffic against a
    # half-migrated schema.
    #
    # This holds because the free tier runs exactly one instance. On a
    # paid plan with several instances, move this back to
    # preDeployCommand.
    startCommand: flask db upgrade && gunicorn --config gunicorn.conf.py "run:app"

    healthCheckPath: /api/v1/health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: clinicflow-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"

      - key: PYTHON_VERSION
        value: "3.12.7"
