
databases:
  - name: clinicflow-db
    databaseName: clinicflow
    user: clinicflow
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: clinicflow-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    preDeployCommand: flask db upgrade

    startCommand: gunicorn --config gunicorn.conf.py "run:app"

    healthCheckPath: /api/v1/health

    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: clinicflow-db
          property: connectionString

      - key: CORS_ORIGINS
        sync: false

      - key: JWT_ACCESS_TOKEN_EXPIRES_MINUTES
        value: "60"

      - key: PYTHON_VERSION
        value: "3.12.7"
